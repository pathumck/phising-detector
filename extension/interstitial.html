<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Phishing Guard</title>
<style>
  :root {
    --bg: #0B1220;
    --card: #141C2E;
    --card-border: #1E293B;
    --text: #F1F5F9;
    --muted: #8B98AF;
    --accent: #38BDF8;
    --success: #22C55E;
    --danger: #EF4444;
    --warning: #F59E0B;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #101B32 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--sans);
  }

  .card {
    width: 92%;
    max-width: 460px;
    background-color: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 28px 28px 24px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .card.blocked {
    border-color: rgba(239, 68, 68, 0.5);
    box-shadow: 0 24px 70px rgba(239, 68, 68, 0.15);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .brand svg { flex-shrink: 0; }

  .brand-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .domain {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text);
    word-break: break-all;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  /* ---- Cascade stepper: the signature element ---- */
  .stepper {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .step {
    flex: 1;
    height: 4px;
    border-radius: 3px;
    background-color: #24304A;
    overflow: hidden;
    position: relative;
  }

  .step-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background-color: var(--accent);
    transition: width 0.3s ease, background-color 0.3s ease;
  }

  .step.cleared .step-fill {
    width: 100%;
    background-color: #2D3B58;
  }

  .step.active .step-fill {
    width: 100%;
    background-color: var(--accent);
  }

  .step.match-safe .step-fill {
    width: 100%;
    background-color: var(--success);
  }

  .step.match-danger .step-fill {
    width: 100%;
    background-color: var(--danger);
  }

  .step-labels {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }

  .step-labels span {
    flex: 1;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #4B5A78;
    text-align: center;
    transition: color 0.25s ease;
  }

  .step-labels span.done { color: var(--muted); }
  .step-labels span.current { color: var(--text); font-weight: 600; }
  .step-labels span.safe-label { color: var(--success); font-weight: 600; }
  .step-labels span.danger-label { color: var(--danger); font-weight: 600; }

  .status-line {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 4px;
  }

  .heading {
    font-size: 20px;
    font-weight: 700;
    color: var(--danger);
    margin: 4px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .details {
    background-color: #0F1729;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 18px;
    font-size: 13.5px;
    line-height: 1.65;
  }

  .details div { margin-top: 4px; }
  .details div:first-child { margin-top: 0; }
  .details strong { color: var(--text); }
  .details span { color: #B7C2D6; }

  button {
    width: 100%;
    border-radius: 9px;
    padding: 12px 16px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    border: none;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }

  button:active { transform: scale(0.98); }

  #goBackBtn {
    background-color: var(--danger);
    color: #FFFFFF;
    margin-bottom: 8px;
  }

  #continueBtn {
    background-color: transparent;
    color: var(--muted);
    border: 1px solid #2D3B58;
    font-size: 12.5px;
    font-weight: 400;
  }

  @media (prefers-reduced-motion: reduce) {
    .step-fill, .card { transition: none; }
  }
</style>
</head>
<body>
  <div id="card" class="card">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 5v6c0 5 3.4 8.5 8 9 4.6-.5 8-4 8-9V5l-8-3z" fill="#22C55E"/>
        <path d="M8.5 12.2l2.3 2.3 4.7-4.7" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Phishing Guard</span>
    </div>
    <div id="content"></div>
  </div>
  <script src="interstitial.js"></script>
</body>
</html>
